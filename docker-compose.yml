version: '3.8'

services:
  mq:
    image: ibm-mqadvanced-server-dev:9.4.1.1-arm64
    container_name: QM1
    ports:
      - "1414:1414"
      - "9443:9443"
    environment:
      - LICENSE=accept
      - MQ_QMGR_NAME=QM1
      - MQ_APP_USER=app
      - MQ_APP_PASSWORD=passw0rd
      - MQ_ADMIN_USER=admin
      - MQ_ADMIN_PASSWORD=passw0rd
    volumes:
      - qm1data:/mnt/mqm
volumes:
  qm1data:
    driver: local